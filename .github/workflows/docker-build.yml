name: Docker build

on:
  push:
    paths:
      - "compose*.yaml"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "karaoke-gen-frontend/**"
      - "karaoke-gen-service/**"
      - "lyrics-align-service/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "compose*.yaml"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "karaoke-gen-frontend/**"
      - "karaoke-gen-service/**"
      - "lyrics-align-service/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

env:
  GENIUS_ACCESS_TOKEN: ci-placeholder
  DJANGO_SECRET_KEY: ci-only-insecure-secret-key-for-smoke-tests

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [karaoke-gen-frontend, karaoke-gen-service, lyrics-align-service]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the PyTorch image
        if: matrix.service == 'lyrics-align-service'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: ${{ matrix.service == 'lyrics-align-service' }}
          tags: ai-karaoke/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Import check for the pipeline
        if: matrix.service == 'lyrics-align-service'
        run: |
          docker run --rm ai-karaoke/${{ matrix.service }}:ci \
            python -c "import torch, torchaudio, demucs, whisperx, fastapi; from src.api.main import app; print('torch', torch.__version__)"

  smoke-test:
    # Boots db + Django + nginx (without the heavy aligner) and checks routing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start web stack
        run: |
          docker compose up -d --build --wait --no-deps \
            db karaoke-gen-service karaoke-gen-frontend || (docker compose logs; exit 1)
      - name: Check endpoints through nginx
        run: |
          set -e
          curl -fsS http://localhost:8080/healthz
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/library
          curl -fsS -o /dev/null http://localhost:8080/admin/login/
          curl -fsS -o /dev/null http://localhost:8080/api/docs/
          css=$(curl -fsS http://localhost:8080/admin/login/ | grep -o '/django-static/admin/css/[^"]*' | head -1)
          curl -fsS -o /dev/null "http://localhost:8080${css}"
          curl -fsS -X POST http://localhost:8080/api/auth/register/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","email":"ci@example.com","password":"Str0ng-pass-123","password_confirm":"Str0ng-pass-123"}'
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
